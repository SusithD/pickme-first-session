name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - if: ${{ hashFiles('prototype/tests/e2e/*.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ hashFiles('prototype/tests/e2e/*.spec.ts') != '' }}
        run: npm run e2e
      - run: npm run build
        env:
          BASE_PATH: /pickme-first-session/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
