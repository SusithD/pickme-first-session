<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PickMe first session walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #f3efe7; font-family: Manrope, system-ui, sans-serif; }
  .stage { display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 80px; height: 100%; padding: 0 140px; box-sizing: border-box; }
  .pill { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; padding: 10px 18px; border: 1px solid rgba(243,239,231,.25); border-radius: 999px; color: rgba(243,239,231,.8); }
  h1 { font-size: 76px; line-height: 1.02; letter-spacing: -.03em; font-weight: 800; margin: 28px 0 22px; }
  h1 em { font-style: normal; color: #fed52f; }
  .sub { font-size: 24px; line-height: 1.45; color: rgba(243,239,231,.7); max-width: 34ch; margin: 0 0 56px; }
  .step { display: grid; grid-template-columns: 64px 1fr; gap: 20px; align-items: start; min-height: 140px; }
  .num { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #211f20; background: #fed52f; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 500; }
  .cap b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
  .cap span { font-size: 21px; line-height: 1.45; color: rgba(243,239,231,.68); }
  .foot { position: absolute; left: 140px; bottom: 48px; font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: .08em; color: rgba(243,239,231,.45); text-transform: uppercase; }
  iframe { width: 460px; height: 964px; border: 0; justify-self: center; }
</style>
</head>
<body>
  <div class="stage">
    <div>
      <span class="pill">Live prototype walkthrough</span>
      <h1>A first ride you can <em>trust</em></h1>
      <p class="sub">PickMe's new-rider first session, redesigned: a fare before signing up, and a fare you can hold.</p>
      <div class="step"><span class="num" id="n">01</span><div class="cap"><b id="t">Choose a language</b><span id="d">No account needed to see your fare.</span></div></div>
    </div>
    <iframe id="phone" title="Live prototype" src="https://susithd.github.io/pickme-first-session/?embed=1&scene=welcome-treatment&v=3"></iframe>
  </div>
  <div class="foot">Unofficial concept · Not affiliated with PickMe · susithd.github.io/pickme-first-session</div>
</body>
</html>
